# Ships main to the production server: build the backend and frontend images
# and push them to GHCR, then SSH in and run deploy/deploy.sh, which pulls them. The key in DEPLOY_SSH_KEY is pinned on the
# server to that one command, so it cannot open a shell. See docs/ops/server-setup.md.
#
# App secrets are written by their own step, so the Deploy step never holds them.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/finexito-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/finexito-${{ matrix.app }}:latest
          # Links the package to this repo, so it shows there and inherits access.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Write secrets to deploy/.env
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        # deploy.sh in sync-env mode reads KEY=value lines from stdin.
        run: |
          test -n "$DJANGO_SECRET_KEY" || { echo "DJANGO_SECRET_KEY secret is not set"; exit 1; }
          test -n "$RESEND_API_KEY" || { echo "RESEND_API_KEY secret is not set"; exit 1; }
          printf 'DJANGO_SECRET_KEY=%s\nRESEND_API_KEY=%s\n' "$DJANGO_SECRET_KEY" "$RESEND_API_KEY" \
            | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$USER@$HOST" sync-env

      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$USER@$HOST" deploy "$GITHUB_SHA" < /dev/null
