# Ships main to the production server: run the tests, build the backend and frontend images
# and push them to GHCR, then SSH in and ask the server to release this commit. The server
# fetches the commit from GitHub itself (deploy/entry.sh), so the SSH key in DEPLOY_SSH_KEY
# only names a commit on main; it is pinned to that one script and cannot open a shell.
# See docs/ops/server-setup.md.
#
# App secrets are written by their own step, so the Deploy step never holds them.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # Mirrors `make lint`, `make test` and `make schema-check`.
  test-backend:
    runs-on: ubuntu-latest
    services:
      # Matches the local default DATABASE_URL, so no settings are needed.
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ehsundar
          POSTGRES_PASSWORD: ehsundar
          POSTGRES_DB: ehsundar
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U ehsundar"
          --health-interval 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # A migration that has run anywhere is history: editing or deleting it leaves
      # databases that no longer match. Add a new migration instead.
      - name: Applied migrations are unchanged
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No previous commit to compare against (first push, manual run or force-push); skipping."
            exit 0
          fi
          changed=$(git diff --name-only --diff-filter=MDR "$BEFORE" HEAD -- '*/migrations/*.py')
          if [ -n "$changed" ]; then
            echo "::error::Existing migrations were modified or removed:"; echo "$changed"; exit 1
          fi
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run python manage.py test
      - name: OpenAPI schema is up to date
        run: |
          uv run python manage.py spectacular --file ../openapi.yml
          git diff --exit-code -- ../openapi.yml

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types are up to date
        run: |
          npm run api:generate
          git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck

  build:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/finexito-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/finexito-${{ matrix.app }}:latest
          # Links the package to this repo, so it shows there and inherits access.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Write secrets to the server's shared/.env
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        # entry.sh in sync-env mode reads KEY=value lines from stdin.
        run: |
          test -n "$DJANGO_SECRET_KEY" || { echo "DJANGO_SECRET_KEY secret is not set"; exit 1; }
          test -n "$RESEND_API_KEY" || { echo "RESEND_API_KEY secret is not set"; exit 1; }
          printf 'DJANGO_SECRET_KEY=%s\nRESEND_API_KEY=%s\n' "$DJANGO_SECRET_KEY" "$RESEND_API_KEY" \
            | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$USER@$HOST" sync-env

      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$USER@$HOST" release "$GITHUB_SHA" < /dev/null
