# Ships main to the production server: run the tests, build the backend and frontend images
# and push them to GHCR, write the server's .env from the production environment's
# secrets and variables, then `make deploy` with this commit's tag, which copies
# deploy/compose.yml and the Caddyfile to the server and brings the stack up on those images.
# See deploy/README.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # Mirrors `make lint`, `make test` and `make schema-check`.
  test-backend:
    runs-on: ubuntu-latest
    services:
      # Matches the local default DATABASE_URL, so no settings are needed.
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ehsundar
          POSTGRES_PASSWORD: ehsundar
          POSTGRES_DB: ehsundar
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U ehsundar"
          --health-interval 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # A migration that has run anywhere is history: editing or deleting it leaves
      # databases that no longer match. Add a new migration instead.
      - name: Applied migrations are unchanged
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No previous commit to compare against (first push, manual run or force-push); skipping."
            exit 0
          fi
          changed=$(git diff --name-only --diff-filter=MDR "$BEFORE" HEAD -- '*/migrations/*.py')
          if [ -n "$changed" ]; then
            echo "::error::Existing migrations were modified or removed:"; echo "$changed"; exit 1
          fi
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run python manage.py test
      - name: OpenAPI schema is up to date
        run: |
          uv run python manage.py spectacular --file ../openapi.yml
          git diff --exit-code -- ../openapi.yml

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types are up to date
        run: |
          npm run api:generate
          git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck

  build:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/finexito-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/finexito-${{ matrix.app }}:latest
          # Links the package to this repo, so it shows there and inherits access.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host server\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' "$HOST" "$USER" > ~/.ssh/config
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts ~/.ssh/config

      # Every secret and variable of the environment goes in; render-env.sh keeps
      # only the keys listed in deploy/.env.example.
      - name: Write the server's .env
        env:
          SECRETS: ${{ toJSON(secrets) }}
          VARS: ${{ toJSON(vars) }}
        run: |
          (umask 077; deploy/render-env.sh > "$RUNNER_TEMP/finexito.env")
          ssh server 'mkdir -p /opt/finexito'
          scp -q "$RUNNER_TEMP/finexito.env" server:/opt/finexito/.env.new
          ssh server 'chmod 600 /opt/finexito/.env.new && mv /opt/finexito/.env.new /opt/finexito/.env'
          rm "$RUNNER_TEMP/finexito.env"

      - name: Deploy
        run: make deploy DEPLOY_HOST=server IMAGE_TAG=$GITHUB_SHA
