services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ehsundar
      POSTGRES_PASSWORD: ehsundar
      POSTGRES_DB: ehsundar
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehsundar"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
