          format: date-time
          readOnly: true
          nullable: true
          description: Set when first published. A future time schedules the page.
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - published_at
      - slug
      - summary
      - title
      - updated_at
      - visibility
