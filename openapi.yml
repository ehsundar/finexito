      - order
      - project
      - subtask_count
      - updated_at
    TaskRequest:
      type: object
      description: |-
        Due dates and times read and write in the caller's time zone.

        Writing ``due_string`` parses it and sets the rest; writing ``due_date`` or
        ``due_time`` sets those, keeping whichever isn't sent, and a recurring task
        keeps recurring.
      properties:
        project:
          type: string
          format: uuid
        section:
          type: string
          format: uuid
          nullable: true
        parent:
          type: string
          format: uuid
          nullable: true
        content:
          type: string
          minLength: 1
          description: Inline Markdown.
          maxLength: 500
        description:
          type: string
          description: Markdown.
          maxLength: 16000
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          minimum: 0
          maximum: 32767
        labels:
          type: array
          items:
            type: string
            format: uuid
        assignee:
          type: string
          format: uuid
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        due_time:
          type: string
          format: time
          nullable: true
        due_string:
          type: string
          maxLength: 200
        extra: {}
      required:
      - content
      - project
    TokenRefreshRequestRequest:
      type: object
      description: |-
        The refresh request really only accepts the refresh token.

        SimpleJWT's own serializer also carries the outgoing ``access`` field, which
        leaks into the generated request schema as a required property.
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TokenRefreshResponse:
      type: object
      description: Both tokens come back, because ``ROTATE_REFRESH_TOKENS`` is enabled.
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenVerifyRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - token
    TransferRequest:
      type: object
      properties:
        user:
          type: string
          format: uuid
      required:
      - user
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        is_staff:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - date_joined
      - email
      - id
      - is_staff
      - last_login
    ViewEnum:
      enum:
      - list
      - board
      type: string
      description: |-
        * `list` - List
        * `board` - Board
    Visibility6ddEnum:
      enum:
      - public
      - private
      type: string
      description: |-
        * `public` - Public
        * `private` - Signed-in members only
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
