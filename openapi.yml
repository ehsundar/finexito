openapi: 3.0.3
info:
  title: ehsundar API
  version: 0.1.0
  description: Shared backend facilities (auth, profiles, settings).
paths:
  /api/v1/auth/google/:
    post:
      operationId: auth_google_create
      description: 'Finish Google sign-in: exchange the code, find or create the account,
        sign it in.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/google/start/:
    post:
      operationId: auth_google_start_create
      description: |-
        Begin Google sign-in: the authorisation URL, with its state and PKCE verifier.

        The frontend keeps `state` and `code_verifier` in sessionStorage, sends
        the browser to `url`, and hands both back to `auth/google/` on return.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleStart'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklist a refresh token so it can no longer be rotated.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '205':
          description: Refresh token blacklisted.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: The authenticated account.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Rotate a refresh token for a fresh pair.

        Subclassed purely so the schema describes the real request and response;
        the behaviour is SimpleJWT's.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/verify/:
    post:
      operationId: auth_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/members/:
    get:
      operationId: members_list
      description: Other members, as they are publicly visible.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - member
          - moderator
        description: |-
          * `member` - Member
          * `moderator` - Moderator
          * `admin` - Admin
      tags:
      - members
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicProfileList'
          description: ''
  /api/v1/members/{id}/:
    get:
      operationId: members_retrieve
      description: Other members, as they are publicly visible.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this profile.
        required: true
      tags:
      - members
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
          description: ''
  /api/v1/pages/:
    get:
      operationId: pages_list
      description: Published pages. Anyone may read public ones; private ones need
        a session.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: visibility
        schema:
          type: string
          enum:
          - private
          - public
        description: |-
          * `public` - Public
          * `private` - Signed-in members only
      tags:
      - pages
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPageSummaryList'
          description: ''
  /api/v1/pages/{slug}/:
    get:
      operationId: pages_retrieve
      description: Published pages. Anyone may read public ones; private ones need
        a session.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          description: The page lives at /pages?slug=<slug>.
        required: true
      tags:
      - pages
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
          description: ''
  /api/v1/profiles/me/:
    get:
      operationId: profiles_me_retrieve
      description: Read or update the caller's profile.
      tags:
      - profiles
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
      operationId: profiles_me_partial_update
      description: Read or update the caller's profile.
      tags:
      - profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/storage/uploads/{id}/:
    put:
      operationId: storage_upload
      description: Send the file as the raw body, with the Content-Type the ticket
        names and a Content-Length. Only the ticket's owner may upload, once, before
        it expires.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - storage
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              format: binary
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredObject'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '411':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/todos/dates/parse/:
    post:
      operationId: todos_dates_parse_create
      description: |-
        What a phrase means as a due date, for the date field's preview, and where
        one is in a task's text, for quick add's.
      tags:
      - todos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DueParseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DueParseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DueParseRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
