        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this label.
        required: true
      tags:
      - todos
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/todos/labels/reorder/:
    post:
      operationId: todos_labels_reorder_create
      description: Put sibling rows in the order given.
      tags:
      - todos
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                type: string
                format: uuid
          multipart/form-data:
            schema:
              type: array
              items:
                type: string
                format: uuid
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
