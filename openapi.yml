      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - todos
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinPreview'
          description: ''
    post:
      operationId: todos_join_create
      description: |-
        An invite link: anyone holding it sees the project's name and who shared it;
        a signed-in member joins with POST.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - todos
