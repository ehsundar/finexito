  /api/v1/storage/uploads/{id}/:
    put:
      operationId: storage_upload
      description: Send the file as the raw body, with the Content-Type the ticket
        names and a Content-Length. Only the ticket's owner may upload, once, before
        it expires.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - storage
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              format: binary
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredObject'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '411':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
