openapi: 3.0.3
info:
  title: ehsundar platform API
  version: 0.1.0
  description: Shared backend facilities (auth, profiles, settings) for every program.
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Exchange email and password for a JWT pair.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklist a refresh token so it can no longer be rotated.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '205':
          description: Refresh token blacklisted.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: The authenticated account, independent of any program.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Password updated.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Rotate a refresh token for a fresh pair.

        Subclassed purely so the schema describes the real request and response;
        the behaviour is SimpleJWT's.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Create an account and, if a program is in scope, enrol into it.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/verify/:
    post:
      operationId: auth_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerify'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenVerify'
          description: ''
  /api/v1/members/:
    get:
      operationId: members_list
      description: Other members of the current program, as they are publicly visible.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - member
          - moderator
        description: |-
          * `member` - Member
          * `moderator` - Moderator
          * `admin` - Admin
      tags:
      - members
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicProfileList'
          description: ''
  /api/v1/members/{id}/:
    get:
      operationId: members_retrieve
      description: Other members of the current program, as they are publicly visible.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this profile.
        required: true
      tags:
      - members
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
          description: ''
  /api/v1/profiles/:
    get:
      operationId: profiles_list
      description: The caller's profiles, plus their profile in the current program.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - profiles
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProfileList'
          description: ''
  /api/v1/profiles/{id}/:
    get:
      operationId: profiles_retrieve
      description: The caller's profiles, plus their profile in the current program.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this profile.
        required: true
      tags:
      - profiles
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/profiles/enrol/:
    post:
      operationId: profiles_enrol_create
      description: Join a program -- the one in the body, or the current one.
      tags:
      - profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Enrol'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Enrol'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Enrol'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/profiles/me/:
    get:
      operationId: profiles_me_retrieve
      description: Read or update the caller's profile in the current program.
      tags:
      - profiles
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
      operationId: profiles_me_partial_update
      description: Read or update the caller's profile in the current program.
      tags:
      - profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPublicProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPublicProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPublicProfile'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/profiles/me/settings/:
    get:
      operationId: profiles_me_settings_retrieve
      description: Resolved settings for the current program, or merge overrides in.
      tags:
      - profiles
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: profiles_me_settings_partial_update
      description: Resolved settings for the current program, or merge overrides in.
      tags:
      - profiles
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/programs/:
    get:
      operationId: programs_list
      description: Read-only catalogue of the programs this instance serves.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - programs
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProgramList'
          description: ''
  /api/v1/programs/{slug}/:
    get:
      operationId: programs_retrieve
      description: Read-only catalogue of the programs this instance serves.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - programs
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
          description: ''
  /api/v1/programs/current/:
    get:
      operationId: programs_current_retrieve
      description: The program resolved from the header, host or default.
      tags:
      - programs
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
          description: ''
components:
  schemas:
    AuthResponse:
      type: object
      description: |-
        Documents the login response body, which ``LoginSerializer`` cannot describe.

        ``LoginSerializer`` only declares the write-only credentials it accepts, so
        without this the generated schema claims login returns nothing usable.
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
      required:
      - access
      - refresh
      - user
    Enrol:
      type: object
      properties:
        program:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        display_name:
          type: string
          maxLength: 150
    Error:
      type: object
      description: Documents the single error envelope every failing response uses.
      properties:
        error:
          allOf:
          - $ref: '#/components/schemas/ErrorDetail'
          readOnly: true
      required:
      - error
    ErrorDetail:
      type: object
      description: The inner payload of the envelope built by ``common.exceptions``.
      properties:
        code:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        fields:
          type: object
          additionalProperties: {}
          readOnly: true
      required:
      - code
      - fields
      - message
    Login:
      type: object
      description: Email/password login returning a JWT pair plus the user payload.
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Logout:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    PaginatedProfileList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
    PaginatedProgramList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Program'
    PaginatedPublicProfileList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicProfile'
    PasswordChange:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
      required:
      - current_password
      - new_password
    PatchedPublicProfile:
      type: object
      description: What other members of the same program may see.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        program:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        avatar_url:
          type: string
          format: uri
          readOnly: true
        bio:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        program:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        display_name:
          type: string
          maxLength: 150
        avatar_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        bio:
          type: string
        locale:
          type: string
          maxLength: 16
        timezone:
          type: string
          maxLength: 64
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        enrolled_at:
          type: string
          format: date-time
          readOnly: true
        data: {}
        settings:
          type: object
          additionalProperties: {}
          readOnly: true
      required:
      - email
      - enrolled_at
      - id
      - program
      - role
      - settings
      - status
    Program:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        enabled_apps:
          readOnly: true
        allow_self_enrolment:
          type: boolean
          readOnly: true
        default_settings:
          readOnly: true
        domains:
          type: array
          items:
            $ref: '#/components/schemas/ProgramDomain'
          readOnly: true
      required:
      - allow_self_enrolment
      - default_settings
      - description
      - domains
      - enabled_apps
      - id
      - name
      - slug
    ProgramDomain:
      type: object
      properties:
        host:
          type: string
          maxLength: 253
        is_primary:
          type: boolean
      required:
      - host
    PublicProfile:
      type: object
      description: What other members of the same program may see.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        program:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        avatar_url:
          type: string
          format: uri
          readOnly: true
        bio:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
      required:
      - avatar_url
      - bio
      - display_name
      - id
      - program
      - role
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        display_name:
          type: string
          maxLength: 150
      required:
      - email
      - password
    RegisterResponse:
      type: object
      description: As above, plus the profile created when the program allows self-enrolment.
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        profile:
          allOf:
          - $ref: '#/components/schemas/Profile'
          readOnly: true
          nullable: true
      required:
      - access
      - profile
      - refresh
      - user
    RoleEnum:
      enum:
      - member
      - moderator
      - admin
      type: string
      description: |-
        * `member` - Member
        * `moderator` - Moderator
        * `admin` - Admin
    StatusEnum:
      enum:
      - active
      - pending
      - suspended
      type: string
      description: |-
        * `active` - Active
        * `pending` - Pending
        * `suspended` - Suspended
    TokenRefreshRequest:
      type: object
      description: |-
        The refresh request really only accepts the refresh token.

        SimpleJWT's own serializer also carries the outgoing ``access`` field, which
        leaks into the generated request schema as a required property.
      properties:
        refresh:
          type: string
      required:
      - refresh
    TokenRefreshResponse:
      type: object
      description: Both tokens come back, because ``ROTATE_REFRESH_TOKENS`` is enabled.
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenVerify:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
      required:
      - token
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        is_email_verified:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - date_joined
      - email
      - id
      - is_email_verified
      - last_login
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
