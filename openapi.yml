components:
  schemas:
    AuthResponse:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
      required:
      - access
      - refresh
      - user
    ColourEnum:
      enum:
      - neutral
      - red
      - orange
      - yellow
      - green
      - teal
      - blue
      - purple
      - pink
      type: string
      description: |-
        * `neutral` - Neutral
        * `red` - Red
        * `orange` - Orange
        * `yellow` - Yellow
        * `green` - Green
        * `teal` - Teal
        * `blue` - Blue
        * `purple` - Purple
        * `pink` - Pink
    ContentTypeEnum:
      enum:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      - image/avif
      - application/pdf
      type: string
      description: |-
        * `image/jpeg` - image/jpeg
        * `image/png` - image/png
        * `image/gif` - image/gif
        * `image/webp` - image/webp
        * `image/avif` - image/avif
        * `application/pdf` - application/pdf
    Error:
      type: object
      description: Documents the single error envelope every failing response uses.
      properties:
        error:
          allOf:
          - $ref: '#/components/schemas/ErrorDetail'
          readOnly: true
      required:
      - error
    ErrorDetail:
      type: object
      description: The inner payload of the envelope built by ``common.exceptions``.
      properties:
        code:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        fields:
          type: object
          additionalProperties: {}
          readOnly: true
      required:
      - code
      - fields
      - message
    Filter:
      type: object
      properties:
        slug:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        is_favourite:
          type: boolean
          readOnly: true
        order:
          type: integer
          readOnly: true
          nullable: true
      required:
      - is_favourite
      - name
      - order
      - slug
    GoogleLogin:
      type: object
      properties:
        code:
          type: string
        code_verifier:
          type: string
      required:
      - code
      - code_verifier
    GoogleStart:
      type: object
      description: Where to send the browser, and what the frontend keeps until it
        returns.
      properties:
        url:
          type: string
          readOnly: true
        state:
          type: string
          readOnly: true
        code_verifier:
          type: string
          readOnly: true
      required:
      - code_verifier
      - state
      - url
    Label:
      type: object
      description: |-
        Saves through the model's ``full_clean()``, so its rules and limits apply.

        Related fields only offer the caller's own rows; anything else reads as missing.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          pattern: ^[\w-]+$
          maxLength: 60
        colour:
          $ref: '#/components/schemas/ColourEnum'
        is_favourite:
          type: boolean
        order:
          type: integer
          readOnly: true
        open_task_count:
          type: integer
          readOnly: true
          default: 0
      required:
      - id
      - name
      - open_task_count
      - order
    Logout:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    Page:
      type: object
      description: 'What a listing needs: everything but the body.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: The page lives at /pages/<slug>.
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          readOnly: true
        summary:
          type: string
          readOnly: true
          description: Shown in listings and link previews.
        visibility:
          allOf:
          - $ref: '#/components/schemas/Visibility6ddEnum'
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Set when first published. A future time schedules the page.
        updated_at:
          type: string
          format: date-time
          readOnly: true
        body:
          type: string
          readOnly: true
          description: Markdown. Raw HTML is shown as text.
      required:
      - body
      - id
      - published_at
      - slug
      - summary
      - title
      - updated_at
      - visibility
    PageSummary:
      type: object
      description: 'What a listing needs: everything but the body.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: The page lives at /pages/<slug>.
          pattern: ^[-a-zA-Z0-9_]+$
        title:
