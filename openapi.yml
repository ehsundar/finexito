          type: string
          format: uuid
          nullable: true
        parent:
          type: string
          format: uuid
          nullable: true
        content:
          type: string
          minLength: 1
          description: Inline Markdown.
          maxLength: 500
        description:
          type: string
          description: Markdown.
          maxLength: 16000
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          minimum: 0
          maximum: 32767
        labels:
          type: array
          items:
            type: string
            format: uuid
        assignee:
          type: string
          format: uuid
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        due_time:
          type: string
          format: time
          nullable: true
        due_string:
          type: string
          maxLength: 200
        extra: {}
      required:
      - content
      - project
    Template:
      type: object
      description: A built-in template (its id is its slug) or one of the member's
        own.
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        category:
          type: string
          readOnly: true
        is_mine:
          type: boolean
          readOnly: true
        task_count:
          type: integer
          readOnly: true
        section_count:
          type: integer
          readOnly: true
      required:
      - category
      - id
      - is_mine
      - name
      - section_count
      - task_count
    TokenRefreshRequestRequest:
      type: object
      description: |-
        The refresh request really only accepts the refresh token.

        SimpleJWT's own serializer also carries the outgoing ``access`` field, which
        leaks into the generated request schema as a required property.
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TokenRefreshResponse:
      type: object
      description: Both tokens come back, because ``ROTATE_REFRESH_TOKENS`` is enabled.
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenVerifyRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - token
    TransferRequest:
      type: object
      properties:
        user:
          type: string
          format: uuid
      required:
      - user
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        is_staff:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - date_joined
      - email
      - id
      - is_staff
      - last_login
    ViewEnum:
      enum:
      - list
      - board
      type: string
      description: |-
        * `list` - List
        * `board` - Board
    VisibilityEnum:
      enum:
      - public
      - private
      type: string
      description: |-
        * `public` - Public
        * `private` - Signed-in members only
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
