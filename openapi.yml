  /api/v1/todos/tasks/reschedule/:
    post:
      operationId: todos_tasks_reschedule_create
      description: Move tasks to a date, each keeping its time.
      parameters:
      - in: query
        name: completed
        schema:
          type: boolean
        description: 'Completed tasks only, newest first. Default: open.'
      - in: query
        name: filter
        schema:
          type: string
        description: A built-in filter's slug.
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: For `view=upcoming`; default today.
      - in: query
        name: label
        schema:
          type: string
      - in: query
        name: parent
        schema:
          type: string
        description: A task id, or `none` for the top level.
      - in: query
        name: project
        schema:
          type: string
      - in: query
        name: q
        schema:
          type: string
        description: Text in the content or description.
      - in: query
        name: section
        schema:
          type: string
        description: A section id, or `none` for no section.
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: For `view=upcoming`; default a week on.
      - in: query
        name: view
        schema:
          type: string
          enum:
          - today
          - upcoming
        description: '`today`: overdue and due today. `upcoming`: due `from` to `to`.'
      tags:
      - todos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RescheduleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RescheduleRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
