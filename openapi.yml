components:
  schemas:
    ApplyTemplateRequest:
      type: object
      properties:
        project:
          type: string
          format: uuid
          nullable: true
          description: Add to this project; default a new one.
        name:
          type: string
          minLength: 1
          description: The new project's name; default the template's.
          maxLength: 120
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          readOnly: true
        content_type:
          type: string
        size:
          type: integer
        url:
          type: string
          readOnly: true
          description: A signed link, good for an hour or so.
      required:
      - content_type
      - id
      - name
      - size
      - url
    AttachmentRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        content_type:
          type: string
          minLength: 1
        size:
          type: integer
      required:
      - content_type
      - id
      - size
    AttachmentTicket:
      type: object
      properties:
        id:
          type: string
          format: uuid
        upload_url:
          type: string
          description: 'PUT the file''s raw bytes here, with `If-None-Match: *`. It
            may be a path on this API or a URL elsewhere.'
      required:
      - id
      - upload_url
    AttachmentTicketRequestRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        content_type:
          $ref: '#/components/schemas/ContentTypeEnum'
        size:
          type: integer
          minimum: 1
      required:
      - content_type
      - name
      - size
    AuthResponse:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
      required:
      - access
      - refresh
      - user
    Changes:
      type: object
      properties:
        token:
          type: string
          description: Send it as `since` next time.
        full:
          type: boolean
          description: 'Everything, not changes: replace the local copy.'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        sections:
          type: array
          items:
            $ref: '#/components/schemas/Section'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        deleted:
          type: array
          items:
            $ref: '#/components/schemas/Deleted'
      required:
      - deleted
      - full
      - labels
      - projects
      - sections
      - tasks
      - token
    ColourEnum:
      enum:
      - neutral
      - red
      - orange
      - yellow
      - green
      - teal
      - blue
      - purple
      - pink
      type: string
      description: |-
        * `neutral` - Neutral
        * `red` - Red
        * `orange` - Orange
        * `yellow` - Yellow
        * `green` - Green
        * `teal` - Teal
        * `blue` - Blue
        * `purple` - Purple
        * `pink` - Pink
    Comment:
      type: object
      description: |-
        Saves through the model's ``full_clean()``, so its rules and limits apply.

        Related fields only offer rows the caller can see; anything else reads as missing.
        A new row may bring its own ``id``, made by a client that was offline, so other
        rows can point at it before the server has seen it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        task:
          type: string
          format: uuid
          nullable: true
        project:
          type: string
          format: uuid
          nullable: true
        author:
          allOf:
          - $ref: '#/components/schemas/Person'
          readOnly: true
        text:
          type: string
          description: Markdown.
          maxLength: 15000
        attachment:
          allOf:
          - $ref: '#/components/schemas/Attachment'
          readOnly: true
          nullable: true
        edited_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attachment
      - author
      - created_at
      - edited_at
      - id
    CommentRequest:
      type: object
      description: |-
        Saves through the model's ``full_clean()``, so its rules and limits apply.

        Related fields only offer rows the caller can see; anything else reads as missing.
        A new row may bring its own ``id``, made by a client that was offline, so other
        rows can point at it before the server has seen it.
      properties:
        task:
          type: string
          format: uuid
          nullable: true
        project:
          type: string
          format: uuid
          nullable: true
        text:
          type: string
          description: Markdown.
          maxLength: 15000
        attachment_id:
          type: string
          format: uuid
          writeOnly: true
          nullable: true
          description: An uploaded file, from `comments/attachments/`; only when posting.
    Connection:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ConnectionStatusEnum'
        projects:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
          description: The member's projects the calendar shows; null for all.
        last_synced_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
      required:
      - last_error
      - last_synced_at
      - projects
      - status
    ConnectionStatusEnum:
      enum:
      - none
      - connected
      - disconnected
      type: string
      description: |-
        * `none` - none
        * `connected` - connected
        * `disconnected` - disconnected
    ContentTypeEnum:
      enum:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      - image/avif
      - application/pdf
      type: string
      description: |-
        * `image/jpeg` - image/jpeg
        * `image/png` - image/png
        * `image/gif` - image/gif
        * `image/webp` - image/webp
        * `image/avif` - image/avif
        * `application/pdf` - application/pdf
    Deleted:
      type: object
      properties:
        kind:
          type: string
        id:
          type: string
          format: uuid
      required:
      - id
      - kind
    Due:
      type: object
      properties:
        date:
          type: string
          format: date
          nullable: true
        time:
          type: string
          format: time
          nullable: true
        string:
          type: string
        is_recurring:
          type: boolean
          readOnly: true
        from_completion:
          type: boolean
      required:
      - date
      - from_completion
      - is_recurring
      - string
      - time
    DueParse:
      type: object
      properties:
        due:
          allOf:
          - $ref: '#/components/schemas/Due'
          nullable: true
        match:
          type: array
          items:
            type: integer
          nullable: true
          description: Where the phrase starts and ends in the text.
        content:
          type: string
          description: The text without the phrase.
      required:
      - content
    DueParseRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
        find:
          type: boolean
          default: false
          description: Look for a phrase inside the text.
      required:
      - text
    Error:
      type: object
