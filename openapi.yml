    Task:
      type: object
      description: |-
        Saves through the model's ``full_clean()``, so its rules and limits apply.

        Related fields only offer the caller's own rows; anything else reads as missing.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
        section:
          type: string
          format: uuid
          nullable: true
        parent:
          type: string
          format: uuid
          nullable: true
        order:
          type: integer
          readOnly: true
        content:
          type: string
          description: Inline Markdown.
          maxLength: 500
        description:
          type: string
          description: Markdown.
          maxLength: 16000
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          minimum: 0
          maximum: 32767
        labels:
          type: array
          items:
            type: string
            format: uuid
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        extra: {}
        subtask_count:
          type: integer
          readOnly: true
          default: 0
        completed_subtask_count:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - completed_at
      - completed_subtask_count
      - content
      - created_at
      - id
      - order
      - project
      - subtask_count
      - updated_at
    TokenRefreshRequest:
      type: object
      description: |-
        The refresh request really only accepts the refresh token.

        SimpleJWT's own serializer also carries the outgoing ``access`` field, which
        leaks into the generated request schema as a required property.
      properties:
        refresh:
          type: string
      required:
      - refresh
    TokenRefreshResponse:
      type: object
      description: Both tokens come back, because ``ROTATE_REFRESH_TOKENS`` is enabled.
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenVerify:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
      required:
      - token
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - date_joined
      - email
      - id
      - last_login
    ViewEnum:
      enum:
      - list
      - board
      type: string
      description: |-
        * `list` - List
        * `board` - Board
    Visibility6ddEnum:
      enum:
      - public
      - private
      type: string
      description: |-
        * `public` - Public
        * `private` - Signed-in members only
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
